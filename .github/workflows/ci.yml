name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start ParaBank
        run: docker run -d --name parabank -p 8080:8080 parasoft/parabank

      # Tomcat accepts connections well before the app is usable, and "/parabank/"
      # answers with a 302, so treat any response other than curl's 000
      # (could not connect) as up.
      - name: Wait for ParaBank to accept connections
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/parabank/ || echo 000)
            if [ "$code" != "000" ]; then
              echo "Tomcat responding (HTTP $code) after ~$((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "ParaBank never accepted connections"
          docker logs parabank
          exit 1

      # ParaBank starts with no schema and no data, so every endpoint returns
      # 400 until the demo database is created. This is test data provisioning
      # over HTTP, not a database dependency of the suite.
      # The POST is retried rather than fired once: Tomcat answers on "/parabank/"
      # before the JAX-RS services under "/parabank/services/" are deployed, so an
      # early attempt can 404. Retry until the data endpoint actually returns 200.
      - name: Seed the ParaBank database
        run: |
          for i in $(seq 1 60); do
            seed=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST http://localhost:8080/parabank/services/bank/initializeDB || echo 000)
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/parabank/services/bank/customers/12212/accounts || echo 000)
            if [ "$code" = "200" ]; then
              echo "Demo data ready after ~$((i*2))s (seed returned $seed)"
              exit 0
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "  ~$((i*2))s - seed=$seed data=$code"
            fi
            sleep 2
          done
          echo "Database did not seed"
          docker logs parabank
          exit 1

      - name: Run API tests
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-output/
            target/cucumber-reports.html
            logs/
          retention-days: 14

      - name: Stop ParaBank
        if: always()
        run: docker rm -f parabank